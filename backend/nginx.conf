user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Vue前端服务（8888端口）
    server {
        listen 8888 default_server;  # 改为default_server，适配容器内监听
        server_name _;  # 通配符，兼容所有访问地址（容器内无需指定宿主机IP）

        # Vue前端
        location / {
            root /usr/share/nginx/html/vue;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;  # 解决Vue路由刷新404
            add_header Cache-Control "no-cache, no-store, must-revalidate";  # 避免缓存问题
        }

        # 后端接口代理（指向后端容器服务名+端口）
        location /api/ {
            proxy_pass http://task_manage_backend:9090/;  # 注意：服务名是task_manage_backend（不是backend）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 600s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 文件访问（挂载的宿主机resource目录）
        location /resource/ {
            root /app;
            autoindex off;
            expires 30d;
        }
    }

    # H5小程序服务（8889端口，HTTP）
    server {
        listen 8889;
        server_name _;  # 通配符，兼容所有访问地址

        # 跳转到HTTPS：浏览器禁止HTTP页面使用麦克风(语音输入)，
        # 老链接自动跳到 https://主机名/（443）
        return 301 https://$host/$request_uri;

        # H5小程序
        location / {
            root /usr/share/nginx/html/h5;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;  # 解决H5路由刷新404
            add_header Cache-Control "no-cache, no-store, must-revalidate";  # 避免缓存问题
        }

        # 后端接口代理
        location /api/ {
            proxy_pass http://task_manage_backend:9090/;  # 服务名必须和docker-compose中一致
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 600s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 文件访问
        location /resource/ {
            root /app;
            autoindex off;
            expires 30d;
        }
    }

    # H5小程序服务（443端口，HTTPS）——语音输入必须走这里
    # 证书：/etc/nginx/certs/（由宿主机 /work/task_manage_docker/nginx/certs 挂载），
    # 自签证书含服务器IP(47.96.66.16)，Android点"继续访问"后可用麦克风；
    # 有域名后建议换成免费可信证书(阿里云DV/Let's Encrypt)，iOS/微信也能直接信任
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # H5小程序
        location / {
            root /usr/share/nginx/html/h5;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 后端接口代理（同源HTTPS，规避混合内容拦截；SSE流式需要关缓冲）
        location /api/ {
            proxy_pass http://task_manage_backend:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 600s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;          # AI流式回答(SSE)实时推送
            proxy_cache off;
        }

        # 文件访问
        location /resource/ {
            root /app;
            autoindex off;
            expires 30d;
        }
    }
}