<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpringBoot文件接口测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft Yahei", sans-serif;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }
    h1 {
      font-size: 22px;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .config-box {
      margin-bottom: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 6px;
    }
    .config-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .config-box input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .upload-box {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 50px 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 30px;
      transition: border-color 0.3s;
    }
    .upload-box:hover {
      border-color: #2196F3;
    }
    #file-input {
      display: none;
    }
    .upload-box p {
      color: #666;
      font-size: 16px;
    }
    /* 文件列表样式 */
    .file-list-title {
      font-size: 18px;
      color: #333;
      margin-bottom: 15px;
    }
    .file-list {
      border: 1px solid #eee;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .file-header {
      display: flex;
      padding: 10px 15px;
      background: #f8f8f8;
      font-weight: 500;
      border-bottom: 1px solid #eee;
    }
    .file-header .col1 {
      flex: 1;
    }
    .file-header .col2 {
      width: 180px;
      text-align: center;
    }
    .file-item {
      display: flex;
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      align-items: center;
    }
    .file-item:last-child {
      border-bottom: none;
    }
    .file-item .file-name {
      flex: 1;
      color: #333;
    }
    .file-item .file-actions {
      width: 180px;
      text-align: center;
    }
    /* 按钮样式 */
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      margin: 0 5px;
    }
    .btn-download {
      background-color: #4CAF50;
    }
    .btn-delete {
      background-color: #f44336;
    }
    /* 提示样式 */
    .tip {
      padding: 10px 15px;
      border-radius: 4px;
      margin: 15px 0;
      display: none;
    }
    .tip.show {
      display: block;
    }
    .tip.success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
    .tip.error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }
    .empty-tip {
      padding: 30px;
      text-align: center;
      color: #999;
      border: 1px dashed #eee;
      border-radius: 6px;
    }
  </style>
</head>
<body>
<h1>SpringBoot 文件上传/下载/删除 测试</h1>

<!-- 服务器地址配置 -->
<div class="config-box">
  <label>后端服务器地址（必填）：</label>
  <input id="baseUrl" type="text" value="http://localhost:9090" placeholder="例如：http://127.0.0.1:8080">

</div>

<!-- 文件上传区域 -->
<div class="upload-box" onclick="document.getElementById('file-input').click()">
  <input type="file" id="file-input" onchange="uploadFile(this)">
  <p>📤 点击此处选择文件上传</p>
</div>

<!-- 操作提示 -->
<div id="tip" class="tip"></div>

<!-- 已上传文件列表 -->
<div>
  <h2 class="file-list-title">📁 已上传文件（可下载/删除）</h2>
  <div class="file-list" id="fileList">
    <!-- 文件表头 -->
    <div class="file-header">
      <div class="col1">文件名</div>
      <div class="col2">操作</div>
    </div>
    <!-- 空列表提示 -->
    <div id="emptyTip" class="empty-tip">暂无已上传文件</div>
    <!-- 文件项会动态添加到这里 -->
    <div id="fileItems"></div>
  </div>
</div>

<script>
  // 存储已上传的文件信息
  let fileDataList = [];

  // 显示提示信息
  function showTip(message, isSuccess) {
    const tip = document.getElementById('tip');
    tip.textContent = message;
    tip.className = `tip show ${isSuccess ? 'success' : 'error'}`;
    // 3秒后隐藏提示
    setTimeout(() => {
      tip.className = 'tip';
    }, 3000);
  }

  // 上传文件核心方法
  async function uploadFile(input) {
    const file = input.files[0];
    if (!file) return;

    // 获取服务器地址
    const baseUrl = document.getElementById('baseUrl').value.trim();
    if (!baseUrl) {
      showTip('请先填写后端服务器地址！', false);
      return;
    }

    // 构建表单数据
    const formData = new FormData();
    formData.append('file', file);

    try {
      // 发送上传请求
      const response = await fetch(`${baseUrl}/files/upload`, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();
      if (result.success && result.data) {
        // 上传成功，保存文件信息
        const fileInfo = {
          name: file.name,
          url: result.data,
          key: result.data.split('/').pop() // 提取文件名作为删除/下载的标识
        };
        fileDataList.push(fileInfo);

        // 更新文件列表显示
        renderFileList();
        showTip(`✅ 文件「${file.name}」上传成功！`, true);
      } else {
        showTip(`❌ 文件上传失败：${result.message || '后端返回异常'}`, false);
      }
    } catch (error) {
      showTip(`❌ 上传失败：${error.message || '网络错误'}`, false);
      console.error('上传错误：', error);
    } finally {
      // 清空文件选择框，允许重复上传同一文件
      input.value = '';
    }
  }

  // 下载文件
  function downloadFile(fileKey) {
    const baseUrl = document.getElementById('baseUrl').value.trim();
    if (!baseUrl) {
      showTip('请先填写后端服务器地址！', false);
      return;
    }
    // 拼接下载接口地址并打开新窗口下载
    const downloadUrl = `${baseUrl}/files/download/${fileKey}`;
    window.open(downloadUrl, '_blank');
    showTip(`📥 开始下载文件「${fileKey}」`, true);
  }

  // 删除文件
  async function deleteFile(index) {
    const fileInfo = fileDataList[index];
    if (!fileInfo) return;

    // 确认删除
    if (!confirm(`确定要删除文件「${fileInfo.name}」吗？`)) {
      return;
    }

    const baseUrl = document.getElementById('baseUrl').value.trim();
    if (!baseUrl) {
      showTip('请先填写后端服务器地址！', false);
      return;
    }

    try {
      // 发送删除请求
      await fetch(`${baseUrl}/files/delete/${fileInfo.key}`, {
        method: 'DELETE'
      });

      // 删除成功，更新列表
      fileDataList.splice(index, 1);
      renderFileList();
      showTip(`🗑️ 文件「${fileInfo.name}」删除成功！`, true);
    } catch (error) {
      showTip(`❌ 删除失败：${error.message || '网络错误'}`, false);
      console.error('删除错误：', error);
    }
  }

  // 渲染文件列表（核心：确保下载/删除按钮显示）
  function renderFileList() {
    const emptyTip = document.getElementById('emptyTip');
    const fileItems = document.getElementById('fileItems');

    // 清空现有列表
    fileItems.innerHTML = '';

    // 判断是否有文件
    if (fileDataList.length === 0) {
      emptyTip.style.display = 'block';
      return;
    }

    // 隐藏空提示，显示文件列表
    emptyTip.style.display = 'none';

    // 遍历文件列表，生成每个文件项（包含下载/删除按钮）
    fileDataList.forEach((file, index) => {
      const fileItem = document.createElement('div');
      fileItem.className = 'file-item';
      fileItem.innerHTML = `
          <div class="file-name">${file.name}</div>
          <div class="file-actions">
            <button class="btn btn-download" onclick="downloadFile('${file.key}')">下载</button>
            <button class="btn btn-delete" onclick="deleteFile(${index})">删除</button>
          </div>
        `;
      fileItems.appendChild(fileItem);
    });
  }

  // 初始化页面时渲染一次列表
  renderFileList();
</script>
</body>
</html>
