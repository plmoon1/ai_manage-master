# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml   # classpath就是resource目录
  type-aliases-package: com.qzb.springboot.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true   # 下划线转驼峰，如stu_name  -> stuName

# 分页
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql


logging:
  level:
#    com.qzb.springboot.mapper: debug # 打印SQL日志
    com.qzb.springboot: debug # 打印SQL日志
  file:
      name: ${qzb.log.file.name}

# 自定义文件上传路径（核心：改为绝对路径，不要用相对路径）
file:
  upload:
    # Windows 示例：D:/nginx/files/
    # Linux/Mac 示例：/usr/local/nginx/files/
    path: ${qzb.file.upload.path}  # 指向隔离目录
    # 前端访问上传文件的前缀（和 Nginx 配置对应）
    access-path: ${qzb.file.upload.access-path}      # 前端访问前缀


