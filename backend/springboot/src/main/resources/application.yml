server:
  port: 9090

#ip: localhost
# 数据库配置
spring:
  profiles:
    active: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root   #数据库用户名
    password: ${qzb.db.pw} #数据库密码
    url: jdbc:mysql://${qzb.db.host}:${qzb.db.port}/task_manage?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    # 连接池调优：远程MySQL/防火墙会掐断空闲几分钟的连接，默认maxLifetime(30分钟)远大于它，
    # 池里会积累死连接，每次取用要卡5秒校验失败才淘汰一个（一次请求最多白等25秒+，导致"请求超时"）
    hikari:
      max-lifetime: 120000        # 连接最长存活2分钟，赶在服务器掐断前主动退休
      keepalive-time: 45000       # 空闲45秒发心跳保活，避免存活期内的连接被掐
      validation-timeout: 3000    # 连接校验3秒超时，死连接快速淘汰不再卡5秒
      connection-timeout: 10000   # 获取连接最多等10秒
      minimum-idle: 2
      maximum-pool-size: 10


  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
